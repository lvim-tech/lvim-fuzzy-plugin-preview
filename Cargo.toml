[package]
name = "lvim-fuzzy-plugin-preview"
version = "0.1.2"
edition = "2024"
license = "BSD-3-Clause"
description = "The preview provider plugin of the lvim tools: it COMPUTES the previews (a directory, a CSV / TSV table, an archive, a binary file ...); lvim-fuzzy-ui draws them"
repository = "https://github.com/lvim-tech/lvim-fuzzy-plugin-preview"
rust-version = "1.85"

[lib]
name = "lvim_fuzzy_plugin_preview"
path = "src/lib.rs"

[[bin]]
name = "lvim-fuzzy-plugin-preview"
path = "src/main.rs"

[dependencies]
# the computations (list a directory, read a table, list an archive) live here for now; the plugin is the thin process around them
lvim-fuzzy-ui = { path = "../lvim-fuzzy-ui" }
# writes its own plugin.toml into the shared plugins directory (the plugin ships inside lfz and lvc)
lvim-fuzzy-plugin = { path = "../lvim-fuzzy-plugin", default-features = false }
serde_json = "1"

[dev-dependencies]
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[workspace]
